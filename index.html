<!doctype html>
<!--
  Norlys Remote – custom Cast receiver (Google CAF).
  Host on HTTPS (GitHub Pages) and register the URL in the Google Cast SDK Developer Console
  as a "Custom Receiver"; the app id it gives you goes into the app's settings.
  The sender passes the Widevine license URL in LOAD.customData.licenseUrl and, optionally,
  start-up tuning in LOAD.customData.tuning (see TUNING below).
-->
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body { margin: 0; background: #000; }
    cast-media-player { --splash-image: none; --logo-image: none; --theme-hue: 355; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const VERSION = "2026-10-28.3";
    const NS = "urn:x-cast:dk.banglarsen.norlysremote";
    const context = cast.framework.CastReceiverContext.getInstance();
    const player = context.getPlayerManager();
    let licenseUrl = null;
    // TUNING (all optional): { initialBandwidth: bits/s, rebufferingGoal: s, ignoreMinBufferTime: bool }
    let tuning = {};

    player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (req) => {
      const data = req.customData || {};
      licenseUrl = data.licenseUrl || null;
      tuning = data.tuning || {};
      req.media.streamType = cast.framework.messages.StreamType.LIVE;
      if (req.media.contentType === "application/dash+xml" || /\.mpd(\?|$)/.test(req.media.contentId)) {
        req.media.contentType = "application/dash+xml";
      }
      // LOAD requests carry no senderId, so broadcast (undefined = all connected senders).
      context.sendCustomMessage(NS, undefined, { type: "LOAD_INFO", version: VERSION, tuning });
      return req;
    });

    player.setMediaPlaybackInfoHandler((loadRequest, playbackConfig) => {
      if (licenseUrl) {
        playbackConfig.protectionSystem = cast.framework.ContentProtection.WIDEVINE;
        playbackConfig.licenseUrl = licenseUrl;
      }
      if (tuning.initialBandwidth) playbackConfig.initialBandwidth = tuning.initialBandwidth;
      if (tuning.rebufferingGoal !== undefined || tuning.ignoreMinBufferTime) {
        playbackConfig.shakaConfig = {
          streaming: tuning.rebufferingGoal !== undefined ? { rebufferingGoal: tuning.rebufferingGoal } : {},
          manifest: { dash: { ignoreMinBufferTime: !!tuning.ignoreMinBufferTime } },
        };
      }
      return playbackConfig;
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true; // flow-TV: keep the session alive between channel switches
    options.maxInactivity = 3600;
    options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
    context.start(options);
  </script>
</body>
</html>
